name: build

on:
  push:
    tags: ["v*"]      # git tag v0.1.0 -> ghcr.io/kcjones91/market-intel-frontend:v0.1.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kcjones91/market-intel-frontend
  TAG: ${{ github.ref_name }}     # passed as data, never pasted into a shell line

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build -t "$IMAGE:$TAG" .

      - name: Smoke test (server starts and renders in mock mode)
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE:$TAG"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/companies
          docker rm -f smoke

      - name: Push
        if: github.ref_type == 'tag'
        run: docker push "$IMAGE:$TAG"
